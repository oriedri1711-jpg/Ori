<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14091c">
<title>Between Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, playful, intimate — a premium card game for two, never a questionnaire.
   IDEA: a velvet card table at night; every mode is a deck with its own colour.
   PICTURE: big gradient playing cards that draw, flip and fly; two intertwined rings as the mark.
   COLOUR and TYPE: deep plum night, rose and wine accents, per-mode gradients; Fredoka for display, Rubik for text.
   LAYOUT: one-hand phone column (max 480px), sticky top bar, bottom tab bar, sheets from below. */
:root{color-scheme:dark;
--bg:#14091c;--bg2:#1c0f27;--sur:#22122f;--sur2:#2c1840;--line:rgba(255,255,255,.09);--ink:#fbf0f7;--mut:#bba5c4;--dim:#8c7697;
--rose:#ff5c8a;--wine:#c2185b;--gold:#ffc46b;--ok:#46d39a;--warn:#ffb347;
--sh:0 18px 40px -18px rgba(0,0,0,.7);--r:22px;
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
:root[data-ui=light]{color-scheme:light;--bg:#fbf2f6;--bg2:#f5e6ee;--sur:#ffffff;--sur2:#f6ebf2;--line:rgba(60,10,50,.1);--ink:#2a1230;--mut:#76597e;--dim:#9b84a2;--sh:0 18px 40px -22px rgba(90,20,70,.35)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.55 Rubik,system-ui,sans-serif;overflow-x:clip;min-height:100dvh;
background:radial-gradient(120% 60% at 100% -10%,rgba(194,24,91,.28),transparent 60%),radial-gradient(90% 50% at -10% 10%,rgba(110,60,220,.22),transparent 60%),var(--bg);background-attachment:fixed}
:root[data-ui=light] body{background:radial-gradient(120% 60% at 100% -10%,rgba(255,92,138,.18),transparent 60%),radial-gradient(90% 50% at -10% 10%,rgba(140,90,255,.12),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:12px}
h1,h2,h3,.disp{font-family:Fredoka,Rubik,sans-serif;font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:34px}h2{font-size:24px}h3{font-size:19px}
p{margin:0}
.mut{color:var(--mut)}.dim{color:var(--dim)}.sm{font-size:14px}.xs{font-size:13px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(92px + var(--safe-b))}
#app.nonav{padding-bottom:calc(24px + var(--safe-b))}
.scr{padding:0 18px;animation:scrIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(12px)}}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(12px + var(--safe-t)) 18px 12px;margin:0 -18px 6px;background:linear-gradient(var(--bg) 60%,transparent);backdrop-filter:blur(6px)}
.top h2{flex:1;font-size:22px}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--sur);border:1px solid var(--line);color:var(--ink);flex:none;position:relative}
.ib:active{transform:scale(.94)}
.ib.on{color:var(--rose);border-color:rgba(255,92,138,.5)}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:12px}
.wrap{flex-wrap:wrap}.sp{flex:1}
.mt{margin-top:18px}.mt2{margin-top:28px}.mb{margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:18px;font-weight:600;font-size:17px;background:linear-gradient(135deg,var(--rose),var(--wine));color:#fff;box-shadow:0 12px 28px -12px rgba(255,60,120,.7);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--sur2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--mut);box-shadow:none;min-height:46px}
.btn.wide{width:100%}.btn.sm{min-height:44px;font-size:15px;padding:0 16px;border-radius:14px}
.btn.gold{background:linear-gradient(135deg,#ffd36b,#ff9b3a);color:#3a1a00}
.btn.ok{background:linear-gradient(135deg,#46d39a,#1f9e78)}
.btn[disabled]{opacity:.45;pointer-events:none}
.tile{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.tile.tap{cursor:pointer;transition:transform .15s}.tile.tap:active{transform:scale(.98)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec h3{font-size:20px}.sec button{color:var(--rose);font-weight:500;font-size:15px;min-height:36px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:var(--sur2);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.on{background:rgba(255,92,138,.18);border-color:rgba(255,92,138,.6);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -18px;padding-inline:18px}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.16);color:#fff;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bar{height:10px;border-radius:99px;background:var(--sur2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .6s}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + var(--safe-b));background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;font-size:12px;color:var(--dim);border-radius:14px}
.nav button.on{color:var(--ink)}.nav button.on svg{stroke:var(--rose)}
/* mode tiles */
.mode{position:relative;overflow:hidden;border-radius:24px;padding:16px;min-height:150px;color:#fff;background:linear-gradient(145deg,var(--g1),var(--g2));box-shadow:0 18px 34px -18px var(--g2);display:flex;flex-direction:column;justify-content:flex-end;text-align:start}
.mode h3{font-size:18px;position:relative}.mode p{font-size:13px;opacity:.85;position:relative;margin-top:4px}
.mode .art{position:absolute;inset:-10px -16px auto auto;width:120px;height:120px;opacity:.9}
.mode .lock{position:absolute;top:12px;left:12px}
.mode.big{min-height:120px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:22px;color:#fff;min-height:250px;background:linear-gradient(150deg,#ff5c8a 0%,#c2185b 45%,#5b1a8a 100%);box-shadow:0 30px 50px -24px rgba(194,24,91,.8)}
.hero h1{font-size:32px;position:relative;max-width:70%}
.hero .art{position:absolute;left:-40px;top:-40px;width:200px;height:200px;opacity:.22}
/* playing card */
.stage{perspective:1400px;margin:6px 0 14px;position:relative}
.deckshadow{position:absolute;inset:14px 18px -10px;border-radius:30px;background:var(--sur2);transform:rotate(-3deg);opacity:.7}
.deckshadow.b{transform:rotate(3deg);opacity:.45;inset:10px 26px -14px}
.card{position:relative;border-radius:30px;min-height:min(62dvh,460px);padding:22px 20px;color:#fff;display:flex;flex-direction:column;background:linear-gradient(155deg,var(--g1),var(--g2));box-shadow:0 30px 60px -26px var(--g2),inset 0 1px 0 rgba(255,255,255,.25);transform-style:preserve-3d;overflow:hidden;touch-action:pan-y}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 50% at 85% 0%,rgba(255,255,255,.22),transparent 60%),radial-gradient(60% 40% at 0% 100%,rgba(0,0,0,.25),transparent 70%);pointer-events:none}
.card .pat{position:absolute;inset:auto -40px -40px auto;width:220px;height:220px;opacity:.16;pointer-events:none}
.card .hd{display:flex;align-items:center;gap:8px;position:relative;flex-wrap:wrap}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}.dots i.f{background:#fff}
.card .body{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;padding:18px 2px}
.card .txt{font-family:Fredoka,Rubik,sans-serif;font-weight:500;font-size:clamp(22px,6.4vw,27px);line-height:1.3;text-wrap:balance}
.card .turn{font-size:14px;opacity:.9;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card .ft{position:relative}
.card.in{animation:drawIn .55s cubic-bezier(.2,.9,.25,1.1)}
.card.out{animation:flyOut .32s ease-in forwards}
.card.skip{animation:dropOut .3s ease-in forwards}
@keyframes drawIn{0%{transform:translateY(40px) rotateY(-100deg) scale(.9);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes flyOut{to{transform:translateX(-120%) rotate(-14deg);opacity:0}}
@keyframes dropOut{to{transform:translateY(60px) scale(.92);opacity:0}}
.veil{position:absolute;inset:0;border-radius:inherit;display:grid;place-items:center;text-align:center;background:linear-gradient(155deg,var(--g1),var(--g2));z-index:3;cursor:pointer;padding:24px}
.veil .ring{width:120px;height:120px;margin:0 auto 14px}
.veil.go{animation:veilGo .5s ease forwards}
@keyframes veilGo{to{opacity:0;transform:scale(1.08);visibility:hidden}}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{min-height:52px;border-radius:16px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.25);color:#fff;font-weight:500;padding:8px 14px;text-align:start;font-size:16px}
.opt.on{background:#fff;color:#2a1230;border-color:#fff}
.opt:active{transform:scale(.98)}
.inp{width:100%;min-height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--sur2);padding:12px 14px;font-size:16px;color:var(--ink)}
.card .inp{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.card .inp::placeholder{color:rgba(255,255,255,.7)}
textarea.inp{min-height:96px;resize:vertical}
.acts{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:4px}
.tools{display:flex;justify-content:space-between;gap:6px;margin-top:12px}
.tools .ib{flex:1;width:auto}
.reveal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.rv{border-radius:18px;padding:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);animation:flipIn .6s cubic-bezier(.2,.9,.3,1.2) both}
.rv:nth-child(2){animation-delay:.18s}
.rv b{display:block;font-size:13px;opacity:.85;font-weight:500}.rv span{font-family:Fredoka;font-size:19px;font-weight:600}
@keyframes flipIn{from{transform:rotateX(90deg);opacity:0}}
.match{margin-top:12px;font-family:Fredoka;font-size:22px;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.gtop{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 0 8px}
.prog{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
.score{display:flex;align-items:center;gap:6px;font-family:Fredoka;font-weight:600;font-size:18px;padding:8px 12px;border-radius:14px;background:var(--sur);border:1px solid var(--line)}
.score svg{stroke:var(--gold)}
.plus{position:fixed;z-index:80;font-family:Fredoka;font-weight:700;font-size:30px;color:var(--gold);text-shadow:0 4px 18px rgba(0,0,0,.4);pointer-events:none;animation:floatUp 1.1s ease-out forwards;left:50%;top:40%}
@keyframes floatUp{from{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}to{transform:translate(-50%,-110px);opacity:0}}
.conf{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 1.8s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.8}}
/* sheet & toast */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(8,2,12,.6);backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;z-index:61;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;max-height:88dvh;overflow:auto;background:var(--bg2);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + var(--safe-b));border-top:1px solid var(--line);animation:up .32s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translate(-50%,100%)}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.toast{position:fixed;z-index:95;top:calc(14px + var(--safe-t));left:50%;transform:translateX(-50%);width:min(92vw,440px);display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--sur2);border:1px solid var(--line);box-shadow:var(--sh);animation:tIn .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes tIn{from{transform:translate(-50%,-30px);opacity:0}}
.toast .badge{width:44px;height:44px}
/* lists & forms */
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.list{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sur2);flex:none}
.li button.li{width:100%;text-align:start}
.sw{width:52px;height:32px;border-radius:99px;background:var(--sur2);border:1px solid var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--dim);transition:.2s}
.sw.on{background:var(--rose);border-color:var(--rose)}.sw.on::after{right:23px;background:#fff}
label.f{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:46px;padding:0 12px;border-radius:14px;background:var(--sur2);border:1.5px solid var(--line);font-weight:500;font-size:15px}
.seg button.on{border-color:var(--rose);background:rgba(255,92,138,.16)}
.badge{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#ffd36b,#ff7b54);color:#3a1400;flex:none}
.badge.off{background:var(--sur2);color:var(--dim)}
.ach{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ach>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:13px}
.ring{position:relative}
.stat{background:var(--sur);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-family:Fredoka;font-size:26px}
.stat span{font-size:13px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.empty svg{width:90px;height:90px;margin:0 auto 10px;display:block}
.mem{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px;border-radius:20px;background:var(--sur);border:1px solid var(--line);text-align:start;width:100%}
.mem img{width:64px;height:64px;border-radius:14px;object-fit:cover}
.tl{position:relative;padding-inline-start:18px}
.tl::before{content:"";position:absolute;top:8px;bottom:8px;right:5px;width:2px;background:linear-gradient(var(--rose),transparent)}
.mis{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:20px;background:var(--sur);border:1px solid var(--line);text-align:start;width:100%}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--dim);display:grid;place-items:center;flex:none;transition:.2s}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.code{font-family:Fredoka;font-size:40px;letter-spacing:.18em;text-align:center;direction:ltr;font-weight:600}
#qr{display:grid;place-items:center;background:#fff;border-radius:18px;padding:12px;width:max-content;margin:12px auto}
#qr img,#qr canvas{width:170px!important;height:170px!important}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:99px;background:var(--sur2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--dim)}.status.ok i{background:var(--ok)}.status.no i{background:#ff6b6b}.status.wait i{background:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.consent{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.consent button{min-height:58px;border-radius:18px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.3);color:#fff;font-weight:600}
.consent button.on{background:#fff;color:#7a0f2e}
.fabt{position:fixed;z-index:35;left:max(14px,calc(50% - 226px));bottom:calc(86px + var(--safe-b));min-width:52px;height:52px;padding:0 14px;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--sur2);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 26px rgba(0,0,0,.45);font-weight:600;font-variant-numeric:tabular-nums}
.fabt svg{width:24px;height:24px}.fabt.on{background:linear-gradient(135deg,var(--rose),var(--wine));color:#fff;border:0}.fabt.lift{bottom:calc(84px + var(--safe-b))}.fabt span{direction:ltr}#app .scr{padding-bottom:calc(160px + var(--safe-b))}
.stop{position:fixed;z-index:40;left:18px;bottom:calc(18px + var(--safe-b));min-height:48px;padding:0 18px;border-radius:99px;background:#fff;color:#7a0f2e;font-weight:700;box-shadow:0 10px 26px rgba(0,0,0,.4);display:flex;align-items:center;gap:6px}
.lockscr{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:72px;border-radius:50%;background:var(--sur);border:1px solid var(--line);font-family:Fredoka;font-size:26px}
.pins{display:flex;gap:12px}.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}.pins i.f{background:var(--rose);border-color:var(--rose)}
.discreet{position:fixed;inset:0;z-index:98;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px}
.splash{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 22px calc(28px + var(--safe-b));gap:18px}
.splash .logo{width:min(62vw,240px);height:min(62vw,240px)}
.logo .r1{animation:spinA 9s linear infinite;transform-origin:50% 50%}
.logo .r2{animation:spinB 11s linear infinite;transform-origin:50% 50%}
@keyframes spinA{to{transform:rotate(360deg)}}@keyframes spinB{to{transform:rotate(-360deg)}}
.steps{display:flex;gap:6px;justify-content:center;margin:8px 0 18px}.steps i{width:26px;height:5px;border-radius:9px;background:var(--line)}.steps i.f{background:var(--rose)}
.gold{background:linear-gradient(110deg,#ffd36b,#ff9b3a,#ffd36b);background-size:200% 100%;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.note{padding:12px 14px;border-radius:16px;background:rgba(255,196,107,.12);border:1px solid rgba(255,196,107,.35);font-size:14px}
.note.info{background:rgba(120,140,255,.12);border-color:rgba(120,140,255,.35)}
table.inf{width:100%;border-collapse:collapse;font-size:14px}
table.inf td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.nomotion *,.nomotion *::before,.nomotion *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
.rar{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#fff}
.r-common{background:#7d8695}.r-uncommon{background:#1f9e6f}.r-rare{background:#2f6fe0}.r-epic{background:#7a3be0}.r-legendary{background:linear-gradient(90deg,#ffb52e,#ff7a1a);color:#3a1a00}.r-lovers{background:linear-gradient(90deg,#ff6fa8,#c2185b,#ff6fa8);background-size:200% 100%;animation:shine 2.5s linear infinite}
.pet{display:inline-block;line-height:1;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.pet.pop{animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
.hab{position:relative;overflow:hidden;border-radius:30px;padding:22px;text-align:center;color:#fff;background:radial-gradient(80% 60% at 50% 30%,rgba(255,255,255,.25),transparent 70%),linear-gradient(160deg,var(--h1),var(--h2));box-shadow:0 30px 50px -24px var(--h2)}
.hab .stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(2px 2px at 70% 20%,#fff8,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff8,transparent),radial-gradient(1.5px 1.5px at 30% 75%,#fff6,transparent);pointer-events:none}
.eggbtn,.petbtn{position:relative;display:block;margin:6px auto 8px}
.eggbtn.ready .egg{animation:wob 1s ease-in-out infinite}@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.eggbtn.shake .egg{animation:wob .18s linear infinite;filter:brightness(1.3) drop-shadow(0 0 20px #fff)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media (min-width:520px){#app{border-inline:1px solid var(--line)}}
</style>
</head>
